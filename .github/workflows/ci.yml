name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, test, build all stores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Data + ≥30% margin gate
        run: node scripts/validate.mjs
      - name: Checkout / webhook unit tests
        run: node tests/run-tests.mjs
      - name: Build all stores
        run: node scripts/build-all.mjs
      - name: Smoke test build output (links, SEO tags, JSON-LD)
        run: node scripts/check-dist.mjs
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/, retention-days: 7 }

  preview:
    name: Preview deploy (${{ matrix.store }})
    needs: verify
    # Only for PRs from this repo (forks never get secrets).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [clinch, snuffel, warmwijs, diepslaap, deskwerk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Build (preview, noindex)
        run: node scripts/build-store.mjs ${{ matrix.store }}
        env:
          PREVIEW: 'true'
      - id: project
        run: echo "name=$(jq -r .cloudflareProject stores/${{ matrix.store }}/store.json)" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/storefront
          command: pages deploy ../../dist/${{ matrix.store }} --project-name=${{ steps.project.outputs.name }} --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.sha }}
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `🔍 Preview **${{ matrix.store }}**: ${{ steps.deploy.outputs.deployment-url }} (test mode, noindex)`,
            });
